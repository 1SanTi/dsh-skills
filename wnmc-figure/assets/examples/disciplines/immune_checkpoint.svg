oke-width="0.7" stroke-linejoin="round" paint-order="stroke">B. 治疗后：免疫激活杀伤肿瘤</text><g transform="translate(1090,340)"><polygon points="63.8,0.0 53.2,22.1 41.7,41.7 17.3,41.8 0.0,67.7 -19.8,47.9 -53.2,53.2 -37.9,15.7 -67.7,0.0 -36.9,-15.3 -55.5,-55.5 -18.1,-43.6 -0.0,-73.0 14.6,-35.3 47.5,-47.5 45.6,-18.9" fill="#F9DCDE" stroke="#D64550" stroke-width="2.6" stroke-linejoin="round"/><circle cx="-6" cy="-4" r="15" fill="#E4DCF2" stroke="#7B5EA7" stroke-width="1.8"/></g><text x="1090" y="428" font-family="SimHei" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">肿瘤细胞</text><rect x="1037" y="290" width="14" height="34" rx="0" fill="#F9DCDE" stroke="#D64550" stroke-width="1.6"/><rect x="1113" y="276" width="14" height="34" rx="0" fill="#F9DCDE" stroke="#D64550" stroke-width="1.6"/><rect x="1131" y="338" width="14" height="34" rx="0" fill="#F9DCDE" stroke="#D64550" stroke-width="1.6"/><line x1="1142" y1="300" x2="1220" y2="245" stroke="#6B7280" stroke-width="1.4"/><circle cx="1142" cy="300" r="2.6" fill="#6B7280"/><text x="1214" y="250" font-family="Helvetica" font-size="14" fill="#1F2937" text-anchor="end" font-weight="bold" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">PD-L1</text><g transform="translate(930,650)"><circle r="50" fill="#D6E8F7" stroke="#2F5D7C" stroke-width="2.4"/><circle cx="-4" cy="-3" r="21.0" fill="#E4DCF2" stroke="#2F5D7C" stroke-width="1.6"/><line x1="-28.2" y1="-38.8" x2="-36.5" y2="-50.1" stroke="#D64550" stroke-width="3" stroke-linecap="round"/><line x1="-1.4" y1="-48.0" x2="-1.8" y2="-62.0" stroke="#D64550" stroke-width="3" stroke-linecap="round"/><line x1="25.9" y1="-40.4" x2="33.5" y2="-52.2" stroke="#D64550" stroke-width="3" stroke-linecap="round"/></g><text x="930" y="730" font-family="SimHei" font-size="13" fill="#2A9D8F" text-anchor="middle" font-weight="normal" stroke="#2A9D8F" stroke-width="0.7" stroke-li