ont-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="middle" font-weight="normal">· 降低 IL-6 / TNF-α</text><text x="700" y="819" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="middle" font-weight="normal">· 缓解敏感肌泛红刺痛</text><g transform="translate(1080,760)"><rect x="-170.0" y="-100.0" width="340" height="200" rx="14" fill="#F3FAF9" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1080" y="682" font-family="SimHei" font-size="15" fill="#2A9D8F" text-anchor="middle" font-weight="normal" stroke="#2A9D8F" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">屏障修护</text><text x="1080" y="735" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="middle" font-weight="normal">· 促进神经酰胺合成</text><text x="1080" y="777" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="middle" font-weight="normal">· FLG 表达↑ 屏障强化</text><text x="1080" y="819" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="middle" font-weight="normal">· 经皮失水率 TEWL↓</text><g transform="translate(200,925)"><rect x="0.0" y="-10.5" width="18" height="9.5" rx="3" fill="#D3F0EC" stroke="#6B7280" stroke-width="1"/><text x="26" y="0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">天麻素</text><rect x="79.1" y="-10.5" width="18" height="9.5" rx="3" fill="#F5E0C8" stroke="#6B7280" stroke-width="1"/><text x="105.11" y="0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">角质层</text><rect x="158.2" y="-10.5" width="18" height="9.5" rx="3" fill="#F6DFE0" stroke="#6B7280" stroke-width="1"/><text x="184.22" y="0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">真皮</text></g><text x="700" y="955" font-family="SimHei" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal">宣称依据：体外功效实验 + 人体功效评价（化妆品功效宣称评价规范）</text>
