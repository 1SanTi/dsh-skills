Hei" font-size="10.5" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">药</text><line x1="940" y1="505" x2="1010" y2="565" stroke="#6B7280" stroke-width="1.4"/><circle cx="940" cy="505" r="2.6" fill="#6B7280"/><text x="1004" y="570" font-family="SimHei" font-size="12" fill="#1F2937" text-anchor="end" font-weight="normal" stroke="#1F2937" stroke-width="4" stroke-linejoin="round" paint-order="stroke">微管破坏 → 凋亡</text><g transform="translate(1200,330)"><rect x="-140.0" y="-210.0" width="280" height="420" rx="14" fill="#FDF5F6" stroke="#D64550" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1200" y="158" font-family="SimHei" font-size="15.5" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">旁观者效应</text><g transform="translate(1150,300)"><polygon points="37.4,0.0 31.2,12.9 24.4,24.4 10.2,24.5 0.0,39.7 -11.6,28.1 -31.2,31.2 -22.2,9.2 -39.7,0.0 -21.6,-9.0 -32.6,-32.6 -10.6,-25.6 -0.0,-42.8 8.6,-20.7 27.8,-27.8 26.7,-11.1" fill="#F9DCDE" stroke="#D64550" stroke-width="2.6" stroke-linejoin="round"/><circle cx="-6" cy="-4" r="15" fill="#E4DCF2" stroke="#7B5EA7" stroke-width="1.8"/></g><g transform="translate(1260,390)"><polygon points="30.8,0.0 25.7,10.6 20.1,20.1 8.4,20.2 0.0,32.7 -9.6,23.1 -25.7,25.7 -18.3,7.6 -32.7,0.0 -17.8,-7.4 -26.8,-26.8 -8.7,-21.1 -0.0,-35.2 7.1,-17.0 22.9,-22.9 22.0,-9.1" fill="#F9DCDE" stroke="#D64550" stroke-width="2.6" stroke-linejoin="round"/><circle cx="-6" cy="-4" r="15" fill="#E4DCF2" stroke="#7B5EA7" stroke-width="1.8"/></g><g transform="translate(1205,345)"><circle r="9" fill="#F9DCDE" stroke="#2F5D7C" stroke-width="2.4"/></g><path d="M 1190 355 L 1245 378" fill="none" stroke="#D64550" stroke-width="2.0" stroke-linecap="round"/><polygon points="1245.0,378.0 1238.4,370.4 1235.0,378.7" fill="#D64550"/><text x="1200" y="460" font-family="SimHei" font-size="12" fill=