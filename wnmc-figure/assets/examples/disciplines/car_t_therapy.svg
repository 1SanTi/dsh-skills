<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
<rect width="1400" height="1050" fill="#FFFFFF"/>
<text x="700.0" y="52" font-family="SimHei" font-size="30" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">CAR-T 细胞免疫治疗：从采集到杀伤</text><g transform="translate(340,330)"><rect x="-240.0" y="-220.0" width="480" height="440" rx="14" fill="#F9F7FC" stroke="#7B5EA7" stroke-width="2" stroke-dasharray="7 5"/></g><text x="340" y="150" font-family="SimHei" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">嵌合抗原受体（CAR）结构</text><rect x="150" y="360" width="380" height="24" rx="0" fill="#DDE7F2" stroke="#1F2937" stroke-width="1.8"/><text x="160" y="410" font-family="SimHei" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal">T 细胞膜</text><path d="M 230 360 L 230 300 L 270 250 L 310 300 L 310 360" fill="none" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="228" font-family="SimHei" font-size="13" fill="#2A9D8F" text-anchor="middle" font-weight="normal" stroke="#2A9D8F" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">scFv 抗原结合域</text><text x="270" y="252" font-family="SimHei" font-size="11.5" fill="#6B7280" text-anchor="middle" font-weight="normal">识别 CD19</text><line x1="310.0" y1="300.0" x2="370.0" y2="300.0" stroke="#6B7280" stroke-width="3.2" stroke-linecap="round"/><text x="390" y="300" font-family="SimHei" font-size="11.5" fill="#6B7280" text-anchor="start" font-weight="normal">铰链区</text><rect x="370" y="346" width="24" height="30" rx="0" fill="#E76F51" stroke="#1F2937" stroke-width="1.2"/><text x="402" y="368" font-family="SimHei" font-size="11.5" fill="#1F2937" text-anchor="start" font-weight="normal">跨膜域</text><rect x="360" y="398" width="105" height="28" rx="6" fill="#E4DCF2" stroke="#7B5EA7" stroke-width="1.4"/><text x="412" y="416" font-family="SimHei" font-size="11.5" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">CD28 共刺激</text><rect x="360" y="434" width="105" height="28" rx="6" fill="#F9DCDE" stroke="#D64550" stroke-width="1.4"/><text x="412" y="452" font-family="SimHei" font-size="11.5" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">CD3ζ 信号</text><text x="340" y="505" font-family="SimHei" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal">第二代 CAR（含共刺激域）</text><g transform="translate(340,800)"><rect x="-240.0" y="-165.0" width="480" height="330" rx="14" fill="#F4F9FE" stroke="#3B7DBF" stroke-width="2" stroke-dasharray="7 5"/></g><text x="340" y="665" font-family="SimHei" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">制备流程（约 2~4 周）</text><circle cx="195" cy="720" r="13" fill="#3B7DBF"/><text x="195" y="726" font-family="Helvetica" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="228" y="727" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">白细胞单采（含 T 细胞）</text><circle cx="195" cy="766" r="13" fill="#3B7DBF"/><text x="195" y="772" font-family="Helvetica" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="228" y="773" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">病毒载体转入 CAR 基因</text><circle cx="195" cy="812" r="13" fill="#3B7DBF"/><text x="195" y="818" font-family="Helvetica" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="228" y="819" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">体外扩增（IL-2 培养）</text><circle cx="195" cy="858" r="13" fill="#3B7DBF"/><text x="195" y="864" font-family="Helvetica" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="228" y="865" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">质检 → 冰冻回输患者</text><circle cx="195" cy="904" r="13" fill="#3B7DBF"/><text x="195" y="910" font-family="Helvetica" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="228" y="911" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">清淋化疗（FC 方案）后输注</text><path d="M 590 800 L 680 800" fill="none" stroke="#2F5D7C" stroke-width="3.0" stroke-linecap="round"/><polygon points="674.0,800.0 665.0,795.5 665.0,804.5" fill="#2F5D7C"/><text x="635.0" y="786.0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">回输</text><g transform="translate(1030,400)"><rect x="-320.0" y="-280.0" width="640" height="560" rx="14" fill="#FDF5F6" stroke="#D64550" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1030" y="160" font-family="SimHei" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">体内杀伤 CD19+ 肿瘤细胞</text><g transform="translate(900,320)"><polygon points="50.6,0.0 42.2,17.5 33.0,33.0 13.7,33.2 0.0,53.7 -15.7,38.0 -42.2,42.2 -30.1,12.5 -53.7,0.0 -29.3,-12.1 -44.0,-44.0 -14.3,-34.6 -0.0,-57.9 11.6,-28.0 37.7,-37.7 36.2,-15.0" fill="#F9DCDE" stroke="#D64550" stroke-width="2.6" stroke-linejoin="round"/><circle cx="-6" cy="-4" r="15" fill="#E4DCF2" stroke="#7B5EA7" stroke-width="1.8"/></g><text x="900" y="398" font-family="SimHei" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">CD19+ 白血病细胞</text><g transform="translate(1180,500)"><circle r="46" fill="#D6E8F7" stroke="#2F5D7C" stroke-width="2.4"/><circle cx="-4" cy="-3" r="19.3" fill="#E4DCF2" stroke="#2F5D7C" stroke-width="1.6"/><line x1="-25.9" y1="-35.6" x2="-34.1" y2="-46.9" stroke="#D64550" stroke-width="3" stroke-linecap="round"/><line x1="-1.3" y1="-44.0" x2="-1.7" y2="-58.0" stroke="#D64550" stroke-width="3" stroke-linecap="round"/><line x1="23.8" y1="-37.0" x2="31.3" y2="-48.8" stroke="#D64550" stroke-width="3" stroke-linecap="round"/></g><text x="1180" y="580" font-family="SimHei" font-size="13" fill="#7B5EA7" text-anchor="middle" font-weight="normal" stroke="#7B5EA7" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">CAR-T 细胞</text><path d="M 1212 462 L 1212 438 L 1230 420 L 1248 438 L 1248 462" fill="none" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1145 465 L 950 355" fill="none" stroke="#D64550" stroke-width="3.0" stroke-linecap="round"/><line x1="955.2" y1="357.9" x2="959.6" y2="350.1" stroke="#D64550" stroke-width="3.6" stroke-linecap="round"/><line x1="955.2" y1="357.9" x2="950.8" y2="365.8" stroke="#D64550" stroke-width="3.6" stroke-linecap="round"/><text x="1047.5" y="396.0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">颗粒酶/穿孔素</text><g transform="translate(800,470)"><polygon points="15.0,0.0 7.5,13.0 -7.5,13.0 -15.0,0.0 -7.5,-13.0 7.5,-13.0" fill="#FBEFD3" stroke="#2F5D7C" stroke-width="2.4" stroke-linejoin="round"/></g><text x="800" y="470" font-family="Helvetica" font-size="10.5" fill="#1F2937" text-anchor="middle" font-weight="bold">IL-2</text><g transform="translate(830,540)"><circle r="15" fill="#FADCD3" stroke="#2F5D7C" stroke-width="2.4"/></g><text x="830" y="540" font-family="Helvetica" font-size="10" fill="#1F2937" text-anchor="middle" font-weight="bold">IFN-γ</text><text x="770" y="590" font-family="SimHei" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal">细胞因子释放</text><g transform="translate(1030,860)"><rect x="-320.0" y="-145.0" width="640" height="290" rx="14" fill="#F3FAF9" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1030" y="745" font-family="SimHei" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">疗效与安全性监测</text><text x="770" y="790" font-family="SimHei" font-size="13" fill="#1F2937" text-anchor="start" font-weight="normal">· 缓解率高：r/r B-ALL 完全缓解约 80~90%</text><text x="770" y="832" font-family="SimHei" font-size="13" fill="#1F2937" text-anchor="start" font-weight="normal">· 不良反应：CRS（细胞因子释放综合征）</text><text x="770" y="874" font-family="SimHei" font-size="13" fill="#1F2937" text-anchor="start" font-weight="normal">· 　→ 分级处理：托珠单抗 / 糖皮质激素</text><text x="770" y="916" font-family="SimHei" font-size="13" fill="#1F2937" text-anchor="start" font-weight="normal">· 神经毒性 ICANS：严密神经评估</text><text x="770" y="958" font-family="SimHei" font-size="13" fill="#1F2937" text-anchor="start" font-weight="normal">· 远期：B 细胞发育不全 → IVIG 替代</text><g transform="translate(150,1015)"><rect x="0.0" y="-10.5" width="18" height="9.5" rx="3" fill="#2A9D8F" stroke="#6B7280" stroke-width="1"/><text x="26" y="0" font-family="Helvetica" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">scFv</text><rect x="87.5" y="-10.5" width="18" height="9.5" rx="3" fill="#E4DCF2" stroke="#6B7280" stroke-width="1"/><text x="113.47999999999999" y="0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">共刺激域</text><rect x="175.0" y="-10.5" width="18" height="9.5" rx="3" fill="#F9DCDE" stroke="#6B7280" stroke-width="1"/><text x="200.95999999999998" y="0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">肿瘤细胞</text><rect x="262.4" y="-10.5" width="18" height="9.5" rx="3" fill="#FBEFD3" stroke="#6B7280" stroke-width="1"/><text x="288.43999999999994" y="0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">细胞因子</text></g>
