<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1000" viewBox="0 0 1450 1000">
<rect width="1450" height="1000" fill="#FFFFFF"/>
<text x="725.0" y="52" font-family="SimHei" font-size="28" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">子痫前期（PE）胎盘单细胞测序研究设计</text><g transform="translate(370,385)"><rect x="-260.0" y="-235.0" width="520" height="470" rx="14" fill="#FDF5F6" stroke="#D64550" stroke-width="2" stroke-dasharray="7 5"/></g><text x="370" y="120" font-family="SimHei" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">胎盘绒毛（胎盘屏障）</text><path d="M 370 560 Q 340 470 300 420 Q 260 370 270 300" fill="none" stroke="#C8A088" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M 370 560 Q 420 480 470 430 Q 520 380 510 320" fill="none" stroke="#C8A088" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M 300 420 Q 350 380 400 340" fill="none" stroke="#C8A088" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270" cy="300" r="17" fill="#F7C8C0" stroke="#D64550" stroke-width="2.0"/><circle cx="330" cy="350" r="17" fill="#F7C8C0" stroke="#D64550" stroke-width="2.0"/><circle cx="400" cy="340" r="17" fill="#F7C8C0" stroke="#D64550" stroke-width="2.0"/><circle cx="510" cy="320" r="17" fill="#F7C8C0" stroke="#D64550" stroke-width="2.0"/><circle cx="470" cy="430" r="17" fill="#F7C8C0" stroke="#D64550" stroke-width="2.0"/><circle cx="280" cy="310" r="9" fill="#F9DCDE" stroke="#D64550" stroke-width="1.6"/><circle cx="420" cy="350" r="9" fill="#F9DCDE" stroke="#D64550" stroke-width="1.6"/><circle cx="500" cy="330" r="8" fill="#F9DCDE" stroke="#D64550" stroke-width="1.6"/><rect x="110" y="590" width="520" height="30" rx="0" fill="#F3E4D2" stroke="none" stroke-width="2"/><text x="370" y="640" font-family="SimHei" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="normal">蜕膜（母体面）：螺旋动脉重铸障碍 → 灌流不足</text><line x1="270" y1="300" x2="180" y2="200" stroke="#6B7280" stroke-width="1.4"/><circle cx="270" cy="300" r="2.6" fill="#6B7280"/><text x="186" y="205" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal" stroke="#1F2937" stroke-width="4" stroke-linejoin="round" paint-order="stroke">CTB 细胞滋养层</text><line x1="400" y1="335" x2="600" y2="210" stroke="#6B7280" stroke-width="1.4"/><circle cx="400" cy="335" r="2.6" fill="#6B7280"/><text x="594" y="215" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="end" font-weight="normal" stroke="#1F2937" stroke-width="4" stroke-linejoin="round" paint-order="stroke">STB 合体滋养层</text><line x1="510" y1="320" x2="620" y2="400" stroke="#6B7280" stroke-width="1.4"/><circle cx="510" cy="320" r="2.6" fill="#6B7280"/><text x="614" y="405" font-family="SimHei" font-size="12.5" fill="#D64550" text-anchor="end" font-weight="normal" stroke="#D64550" stroke-width="4" stroke-linejoin="round" paint-order="stroke">EVT 侵入功能↓</text><line x1="280" y1="318" x2="180" y2="380" stroke="#6B7280" stroke-width="1.4"/><circle cx="280" cy="318" r="2.6" fill="#6B7280"/><text x="186" y="385" font-family="SimHei" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">绒毛血管</text><g transform="translate(1015,385)"><rect x="-325.0" y="-235.0" width="650" height="470" rx="14" fill="#F9F7FC" stroke="#7B5EA7" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1015" y="120" font-family="SimHei" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">单细胞研究方案</text><text x="720" y="190" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">分组（各 n≥3）</text><rect x="720" y="210" width="26" height="26" rx="0" fill="#D3F0EC" stroke="#2A9D8F" stroke-width="1.4"/><text x="760" y="228" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">正常胎盘（足月）</text><rect x="720" y="250" width="26" height="26" rx="0" fill="#F9DCDE" stroke="#D64550" stroke-width="1.4"/><text x="760" y="268" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">PE 胎盘（早发/晚发）</text><path d="M 950 240 L 1000 240" fill="none" stroke="#2F5D7C" stroke-width="2.4" stroke-linecap="round"/><polygon points="994.0,240.0 985.0,235.5 985.0,244.5" fill="#2F5D7C"/><text x="975.0" y="226.0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">解离建库</text><text x="1030" y="228" font-family="SimHei" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal">10x 平台</text><text x="1030" y="254" font-family="SimHei" font-size="11.5" fill="#6B7280" text-anchor="start" font-weight="normal">≥ 5000 cells/样</text><text x="720" y="320" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">主要细胞群与 PE 核心发现</text><rect x="725" y="350" width="18" height="18" rx="0" fill="#D64550" stroke="none" stroke-width="2"/><text x="755" y="364" font-family="SimHei" font-size="12.3" fill="#1F2937" text-anchor="start" font-weight="normal">EVT：侵袭相关基因（ITGA5/ HLA-G）↓ → 螺旋动脉重铸失败</text><rect x="725" y="396" width="18" height="18" rx="0" fill="#E76F51" stroke="none" stroke-width="2"/><text x="755" y="410" font-family="SimHei" font-size="12.3" fill="#1F2937" text-anchor="start" font-weight="normal">CTB → EVT 拟时序受阻，分化轨迹偏移</text><rect x="725" y="442" width="18" height="18" rx="0" fill="#7B5EA7" stroke="none" stroke-width="2"/><text x="755" y="456" font-family="SimHei" font-size="12.3" fill="#1F2937" text-anchor="start" font-weight="normal">Hofbauer 细胞：抗原提呈与促炎通路↑</text><rect x="725" y="488" width="18" height="18" rx="0" fill="#2A9D8F" stroke="none" stroke-width="2"/><text x="755" y="502" font-family="SimHei" font-size="12.3" fill="#1F2937" text-anchor="start" font-weight="normal">蜕膜 NK / T 细胞：免疫耐受失衡</text><rect x="725" y="534" width="18" height="18" rx="0" fill="#3B7DBF" stroke="none" stroke-width="2"/><text x="755" y="548" font-family="SimHei" font-size="12.3" fill="#1F2937" text-anchor="start" font-weight="normal">细胞通讯：EVT-免疫细胞 CXCL/CXCR 通路紊乱</text><g transform="translate(725,760)"><rect x="-615.0" y="-90.0" width="1230" height="180" rx="14" fill="#F4F9FE" stroke="#3B7DBF" stroke-width="2" stroke-dasharray="7 5"/></g><text x="725" y="640" font-family="SimHei" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">向临床转化的落点</text><text x="160" y="700" font-family="SimHei" font-size="13.5" fill="#3B7DBF" text-anchor="start" font-weight="normal" stroke="#3B7DBF" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">预测标志物</text><text x="160" y="735" font-family="SimHei" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal">scRNA 优先基因 → 血浆蛋白（PLGF/sFlt-1 之外的新靶标）</text><text x="560" y="700" font-family="SimHei" font-size="13.5" fill="#3B7DBF" text-anchor="start" font-weight="normal" stroke="#3B7DBF" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">干预靶点</text><text x="560" y="735" font-family="SimHei" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal">促进 EVT 侵袭 / 恢复免疫耐受的小分子或生物药</text><text x="960" y="700" font-family="SimHei" font-size="13.5" fill="#3B7DBF" text-anchor="start" font-weight="normal" stroke="#3B7DBF" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">分型用药</text><text x="960" y="735" font-family="SimHei" font-size="12" fill="#6B7280" text-anchor="start" font-weight="normal">早发型 vs 晚发型 PE 分子分型 → 精准监测</text><text x="725" y="795" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">研究闭环：临床样本 → 单细胞图谱 → 机制发现 → 标志物/靶点验证（qPCR/IHC/血清学）</text><g transform="translate(200,920)"><rect x="0.0" y="-10.5" width="18" height="9.5" rx="3" fill="#F7C8C0" stroke="#6B7280" stroke-width="1"/><text x="26" y="0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">滋养细胞</text><rect x="87.5" y="-10.5" width="18" height="9.5" rx="3" fill="#F9DCDE" stroke="#6B7280" stroke-width="1"/><text x="113.47999999999999" y="0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">绒毛血管</text><rect x="175.0" y="-10.5" width="18" height="9.5" rx="3" fill="#F3E4D2" stroke="#6B7280" stroke-width="1"/><text x="200.95999999999998" y="0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">蜕膜</text><rect x="245.7" y="-10.5" width="18" height="9.5" rx="3" fill="#E4DCF2" stroke="#6B7280" stroke-width="1"/><text x="271.7" y="0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal">免疫细胞</text></g>
</svg>
