-anchor="start" font-weight="normal">· 冻干保护（海藻糖）</text><text x="920" y="745" font-family="SimHei" font-size="13" fill="#1F2937" text-anchor="start" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">代表上市品种</text><text x="940" y="775" font-family="SimHei" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal">· 多柔比星脂质体（Doxil）</text><text x="940" y="803" font-family="SimHei" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal">· 紫杉醇白蛋白纳米粒</text><text x="940" y="831" font-family="SimHei" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal">· mRNA-LNP（脂质纳米粒）</text><text x="940" y="859" font-family="SimHei" font-size="12" fill="#1F2937" text-anchor="start" font-weight="normal">· 两性霉素B脂质体</text><g transform="translate(200,940)"><rect x="0.0" y="-11" width="18" height="10" rx="3" fill="#D6E8F7" stroke="#6B7280" stroke-width="1"/><text x="26" y="0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="start" font-weight="normal">脂质体</text><rect x="80.0" y="-11" width="18" height="10" rx="3" fill="#E4DCF2" stroke="#6B7280" stroke-width="1"/><text x="106.03999999999999" y="0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="start" font-weight="normal">水相药物</text><rect x="168.8" y="-11" width="18" height="10" rx="3" fill="#2A9D8F" stroke="#6B7280" stroke-width="1"/><text x="194.76" y="0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="start" font-weight="normal">PEG 链</text><rect x="266.2" y="-11" width="18" height="10" rx="3" fill="#D64550" stroke="#6B7280" stroke-width="1"/><text x="292.15999999999997" y="0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="start" font-weight="normal">肿瘤血管</text></g>
