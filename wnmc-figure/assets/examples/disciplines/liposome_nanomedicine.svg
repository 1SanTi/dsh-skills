hor="start" font-weight="normal">逃避 RES / 单核吞噬系统</text><path d="M 665 340 L 665 373" fill="none" stroke="#2F5D7C" stroke-width="2.4" stroke-linecap="round"/><polygon points="665.0,367.0 669.5,358.0 660.5,358.0" fill="#2F5D7C"/><circle cx="665" cy="411" r="13" fill="#3B7DBF"/><text x="665" y="417" font-family="Helvetica" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="700" y="407" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">③ EPR 富集</text><text x="700" y="435" font-family="SimHei" font-size="11.3" fill="#6B7280" text-anchor="start" font-weight="normal">肿瘤血管间隙渗出</text><path d="M 665 428 L 665 461" fill="none" stroke="#2F5D7C" stroke-width="2.4" stroke-linecap="round"/><polygon points="665.0,455.0 669.5,446.0 660.5,446.0" fill="#2F5D7C"/><circle cx="665" cy="499" r="13" fill="#3B7DBF"/><text x="665" y="505" font-family="Helvetica" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="700" y="495" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="start" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">④ 细胞摄取</text><text x="700" y="523" font-family="SimHei" font-size="11.3" fill="#6B7280" text-anchor="start" font-weight="normal">内吞 → 溶酶体释放药</text><g transform="translate(1200,330)"><rect x="-170.0" y="-210.0" width="340" height="420" rx="14" fill="#FDF5F6" stroke="#D64550" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1200" y="158" font-family="SimHei" font-size="15.5" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">EPR 效应</text><path d="M 1080 260 Q 1200 225 1320 260" fill="none" stroke="#D64550" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1080 330 Q 1200 365 1320 330" fill=