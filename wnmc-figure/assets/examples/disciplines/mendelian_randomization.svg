<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950">
<rect width="1400" height="950" fill="#FFFFFF"/>
<text x="700.0" y="52" font-family="SimHei" font-size="29" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">孟德尔随机化（MR）：利用遗传变异推断因果</text><g transform="translate(280,420)"><rect x="-145.0" y="-150.0" width="290" height="300" rx="14" fill="#F4F9FE" stroke="#3B7DBF" stroke-width="2" stroke-dasharray="7 5"/></g><text x="280" y="254.0" font-family="SimHei" font-size="15" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">遗传工具变量</text><circle cx="245" cy="330" r="11" fill="#D6E8F7" stroke="#3B7DBF" stroke-width="1.6"/><text x="275" y="338" font-family="Helvetica" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">rs10861</text><circle cx="245" cy="382" r="11" fill="#D6E8F7" stroke="#3B7DBF" stroke-width="1.6"/><text x="275" y="390" font-family="Helvetica" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">rs4712</text><circle cx="245" cy="434" r="11" fill="#D6E8F7" stroke="#3B7DBF" stroke-width="1.6"/><text x="275" y="442" font-family="Helvetica" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">rs2981</text><circle cx="245" cy="486" r="11" fill="#D6E8F7" stroke="#3B7DBF" stroke-width="1.6"/><text x="275" y="494" font-family="Helvetica" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">rs7903146</text><g transform="translate(760,260)"><rect x="-165.0" y="-60.0" width="330" height="120" rx="14" fill="#F3FAF9" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="7 5"/></g><text x="760" y="252" font-family="SimHei" font-size="16" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">暴露（Exposure）</text><text x="760" y="290" font-family="SimHei" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="normal">如：LDL-C、BMI、血压</text><g transform="translate(760,640)"><rect x="-165.0" y="-60.0" width="330" height="120" rx="14" fill="#FDF5F6" stroke="#D64550" stroke-width="2" stroke-dasharray="7 5"/></g><text x="760" y="632" font-family="SimHei" font-size="16" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">结局（Outcome）</text><text x="760" y="670" font-family="SimHei" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="normal">如：冠心病、骨质疏松</text><path d="M 428 380 L 592 285" fill="none" stroke="#2F5D7C" stroke-width="2.4" stroke-linecap="round"/><polygon points="586.8,288.0 576.8,288.6 581.3,296.4" fill="#2F5D7C"/><text x="510.0" y="318.5" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">假设① 关联性</text><path d="M 760 325 L 760 575" fill="none" stroke="#2F5D7C" stroke-width="3.2" stroke-linecap="round"/><polygon points="760.0,569.0 764.5,560.0 755.5,560.0" fill="#2F5D7C"/><text x="760.0" y="436.0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">因果效应 β（IVW）</text><path d="M 428 470 L 592 615" fill="none" stroke="#2F5D7C" stroke-width="2.4" stroke-linecap="round"/><polygon points="592.0,615.0 588.2,605.7 582.3,612.4" fill="#2F5D7C"/><text x="510.0" y="528.5" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">假设③ 仅经暴露</text><g transform="translate(1170,430)"><rect x="-125.0" y="-55.0" width="250" height="110" rx="14" fill="#F7F7F7" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1170" y="422" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">混杂因素</text><text x="1170" y="452" font-family="SimHei" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal">年龄 / 饮食等</text><path d="M 1042 400 L 932 310" fill="none" stroke="#2F5D7C" stroke-width="1.8" stroke-linecap="round"/><polygon points="932.0,310.0 936.1,319.2 941.8,312.2" fill="#2F5D7C"/><path d="M 1042 462 L 932 592" fill="none" stroke="#2F5D7C" stroke-width="1.8" stroke-linecap="round"/><polygon points="932.0,592.0 941.2,588.0 934.4,582.2" fill="#2F5D7C"/><text x="990" y="375" font-family="SimHei" font-size="12.5" fill="#6B7280" text-anchor="start" font-weight="normal">假设② 独立于混杂</text><g transform="translate(1170,690)"><rect x="-135.0" y="-80.0" width="270" height="160" rx="14" fill="#FDF5F6" stroke="#D64550" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1170" y="594.0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">多效性与敏感性检验</text><text x="1063.0" y="655.0" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">· MR-Egger 截距检验</text><text x="1063.0" y="687.0" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">· MR-PRESSO 离群检测</text><text x="1063.0" y="719.0" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">· leave-one-out 留一法</text><g transform="translate(260,800)"><rect x="-200.0" y="-85.0" width="400" height="170" rx="14" fill="#FAFAFA" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 5"/></g><text x="260" y="699.0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">常用方法</text><text x="90.0" y="757.0" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">· IVW（主分析）</text><text x="90.0" y="791.0" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">· 加权中位数 / 加权众数</text><text x="90.0" y="825.0" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">· MR-Egger（水平多效性稳健）</text><g transform="translate(760,800)"><rect x="-200.0" y="-85.0" width="400" height="170" rx="14" fill="#FAFAFA" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 5"/></g><text x="760" y="699.0" font-family="SimHei" font-size="13.5" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">数据来源（公开数据库）</text><text x="590.0" y="757.0" font-family="Helvetica" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">· GWAS Catalog / IEU OpenGWAS</text><text x="590.0" y="791.0" font-family="Helvetica" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">· eQTL: GTEx / eQTLGen</text><text x="590.0" y="825.0" font-family="Helvetica" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">· pQTL: deCODE / UKB-PPP</text><text x="700" y="915" font-family="SimHei" font-size="13.5" fill="#2A9D8F" text-anchor="middle" font-weight="normal" stroke="#2A9D8F" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">解读：β ≠ 0 且各方法方向一致、敏感性分析稳健 → 支持因果关联</text><g transform="translate(170,935)"><rect x="0.0" y="-11" width="18" height="10" rx="3" fill="#3B7DBF" stroke="#6B7280" stroke-width="1"/><text x="26" y="0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="start" font-weight="normal">工具变量 SNP</text><rect x="123.4" y="-11" width="18" height="10" rx="3" fill="#2A9D8F" stroke="#6B7280" stroke-width="1"/><text x="149.44" y="0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="start" font-weight="normal">暴露</text><rect x="194.8" y="-11" width="18" height="10" rx="3" fill="#D64550" stroke="#6B7280" stroke-width="1"/><text x="220.8" y="0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="start" font-weight="normal">结局</text><rect x="266.2" y="-11" width="18" height="10" rx="3" fill="#6B7280" stroke="#6B7280" stroke-width="1"/><text x="292.16" y="0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="start" font-weight="normal">虚线 = 不允许的路径</text></g>
</svg>
