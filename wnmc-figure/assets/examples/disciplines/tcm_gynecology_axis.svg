<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<rect width="1400" height="1000" fill="#FFFFFF"/>
<text x="700.0" y="52" font-family="SimHei" font-size="30" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">中医妇科核心病机：肾-天癸-冲任-胞宫轴</text><g transform="translate(700,240)"><rect x="-130.0" y="-50.0" width="260" height="100" rx="14" fill="#F4F9FE" stroke="#3B7DBF" stroke-width="2" stroke-dasharray="7 5"/></g><text x="700" y="230" font-family="SimHei" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">肾</text><text x="700" y="264" font-family="SimHei" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="normal">先天之本，主生殖</text><path d="M 700 296 L 700 344" fill="none" stroke="#2F5D7C" stroke-width="2.4" stroke-linecap="round"/><polygon points="700.0,338.0 704.5,329.0 695.5,329.0" fill="#2F5D7C"/><text x="700.0" y="306.0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">化生</text><g transform="translate(700,400)"><rect x="-130.0" y="-45.0" width="260" height="90" rx="14" fill="#F9F7FC" stroke="#7B5EA7" stroke-width="2" stroke-dasharray="7 5"/></g><text x="700" y="392" font-family="SimHei" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">天癸</text><text x="700" y="426" font-family="SimHei" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="normal">促进生殖机能成熟</text><path d="M 700 450 L 700 500" fill="none" stroke="#2F5D7C" stroke-width="2.4" stroke-linecap="round"/><polygon points="700.0,494.0 704.5,485.0 695.5,485.0" fill="#2F5D7C"/><g transform="translate(700,555)"><rect x="-130.0" y="-45.0" width="260" height="90" rx="14" fill="#F3FAF9" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="7 5"/></g><text x="700" y="547" font-family="SimHei" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">冲任二脉</text><text x="700" y="581" font-family="SimHei" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="normal">血海 · 阴脉之海</text><path d="M 700 606 L 700 650" fill="none" stroke="#2F5D7C" stroke-width="2.4" stroke-linecap="round"/><polygon points="700.0,644.0 704.5,635.0 695.5,635.0" fill="#2F5D7C"/><text x="700.0" y="614.0" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">下注</text><g transform="translate(700,725)"><rect x="-130.0" y="-65.0" width="260" height="130" rx="14" fill="#FDF5F6" stroke="#D64550" stroke-width="2" stroke-dasharray="7 5"/></g><text x="700" y="715" font-family="SimHei" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">胞宫（子宫）</text><circle cx="630" cy="765" r="17" fill="#FADCD3" stroke="#E76F51" stroke-width="1.6"/><circle cx="770" cy="765" r="17" fill="#FADCD3" stroke="#E76F51" stroke-width="1.6"/><text x="630" y="800" font-family="SimHei" font-size="11.5" fill="#1F2937" text-anchor="middle" font-weight="normal">卵巢</text><text x="770" y="800" font-family="SimHei" font-size="11.5" fill="#1F2937" text-anchor="middle" font-weight="normal">卵巢</text><text x="700" y="745" font-family="SimHei" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="normal">藏泻有时</text><g transform="translate(240,470)"><rect x="-110.0" y="-50.0" width="220" height="100" rx="14" fill="#F7FBF5" stroke="#5B9E51" stroke-width="2" stroke-dasharray="7 5"/></g><text x="240" y="460" font-family="SimHei" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">肝</text><text x="240" y="494" font-family="SimHei" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="normal">疏泄，调畅气血</text><path d="M 360 500 L 560 545" fill="none" stroke="#2F5D7C" stroke-width="2.4" stroke-linecap="round"/><polygon points="554.1,543.7 546.4,537.3 544.4,546.1" fill="#2F5D7C"/><text x="460.0" y="508.5" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">疏泄于冲任</text><g transform="translate(240,630)"><rect x="-110.0" y="-50.0" width="220" height="100" rx="14" fill="#FDFAF2" stroke="#E9C46A" stroke-width="2" stroke-dasharray="7 5"/></g><text x="240" y="620" font-family="SimHei" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">脾</text><text x="240" y="654" font-family="SimHei" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="normal">统血，生化之源</text><path d="M 355 625 L 565 580" fill="none" stroke="#2F5D7C" stroke-width="2.4" stroke-linecap="round"/><polygon points="559.1,581.3 549.4,578.7 551.3,587.5" fill="#2F5D7C"/><text x="460.0" y="588.5" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">充养血海</text><g transform="translate(1160,470)"><rect x="-110.0" y="-50.0" width="220" height="100" rx="14" fill="#F9F7FC" stroke="#7B5EA7" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1160" y="460" font-family="SimHei" font-size="18" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">心</text><text x="1160" y="494" font-family="SimHei" font-size="12.5" fill="#6B7280" text-anchor="middle" font-weight="normal">心神下通胞宫</text><path d="M 1040 500 L 840 545" fill="none" stroke="#2F5D7C" stroke-width="2.4" stroke-linecap="round"/><polygon points="845.9,543.7 855.6,546.1 853.6,537.3" fill="#2F5D7C"/><text x="940.0" y="508.5" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">心肾相交</text><g transform="translate(1160,760)"><rect x="-145.0" y="-120.0" width="290" height="240" rx="14" fill="#FDF5F6" stroke="#D64550" stroke-width="2" stroke-dasharray="7 5"/></g><text x="1160" y="662" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">常见病机</text><text x="1040" y="700" font-family="SimHei" font-size="12.3" fill="#1F2937" text-anchor="start" font-weight="normal">肾虚 → 月经后期、闭经</text><text x="1040" y="740" font-family="SimHei" font-size="12.3" fill="#1F2937" text-anchor="start" font-weight="normal">肝郁 → 痛经、经前诸证</text><text x="1040" y="780" font-family="SimHei" font-size="12.3" fill="#1F2937" text-anchor="start" font-weight="normal">痰湿 → 多囊、闭经</text><text x="1040" y="820" font-family="SimHei" font-size="12.3" fill="#1F2937" text-anchor="start" font-weight="normal">血瘀 → 子宫内膜异位</text><g transform="translate(240,860)"><rect x="-155.0" y="-75.0" width="310" height="150" rx="14" fill="#F3FAF9" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="7 5"/></g><text x="240" y="808" font-family="SimHei" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" stroke="#1F2937" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">治疗大法</text><text x="115" y="868" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">· 补肾填精为根本</text><text x="115" y="896" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">· 疏肝健脾以助源</text><text x="115" y="924" font-family="SimHei" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="normal">· 调理冲任以治标</text><g transform="translate(540,975)"><rect x="0.0" y="-10" width="18" height="9" rx="3" fill="#3B7DBF" stroke="#6B7280" stroke-width="1"/><text x="26" y="0" font-family="SimHei" font-size="13" fill="#1F2937" text-anchor="start" font-weight="normal">主轴</text><rect x="70.1" y="-10" width="18" height="9" rx="3" fill="#5B9E51" stroke="#6B7280" stroke-width="1"/><text x="96.12" y="0" font-family="SimHei" font-size="13" fill="#1F2937" text-anchor="start" font-weight="normal">旁路脏腑</text><rect x="156.4" y="-10" width="18" height="9" rx="3" fill="#D64550" stroke="#6B7280" stroke-width="1"/><text x="182.36" y="0" font-family="SimHei" font-size="13" fill="#1F2937" text-anchor="start" font-weight="normal">病机/胞宫</text></g>
</svg>
